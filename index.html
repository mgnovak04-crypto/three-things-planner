<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Things Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one column of ruled rows, no cards. The three priorities carry big numerals.
     Colour follows the Irish tricolour: green for work, orange for personal, white paper between.
     Each space has a fill (the flag colour) and an ink (the same hue, deep enough to read as text on paper). */
  color-scheme:light;
  --paper:#FFFFFF;
  --sheet:#F3F7F3;
  --ink:#10261B;
  --quiet:#55655B;
  --rule:#D3DDD6;
  --work:#0E8549;
  --on-work:#FFFFFF;
  --work-ink:#0E8549;
  --personal:#FF883E;
  --on-personal:#2B1300;
  --personal-ink:#B85300;
  --done:#1F5C3E;
  --warn:#6A5200;
  --flag-green:#169B62;
  --flag-white:#FFFFFF;
  --flag-orange:#FF883E;
  --scrim:rgb(8 24 16 / .5);
  --display:"Bricolage Grotesque","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --accent:var(--work);
  --on-accent:var(--on-work);
  --accent-ink:var(--work-ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0B1410;
    --sheet:#14211A;
    --ink:#EEF4EF;
    --quiet:#9DACA2;
    --rule:#28382E;
    --work:#27B877;
    --on-work:#04150D;
    --work-ink:#3CCB8A;
    --personal:#FF9A57;
    --on-personal:#2B1300;
    --personal-ink:#FF9A57;
    --done:#CFE8DA;
    --warn:#E3C567;
    --scrim:rgb(0 0 0 / .62);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B1410;
  --sheet:#14211A;
  --ink:#EEF4EF;
  --quiet:#9DACA2;
  --rule:#28382E;
  --work:#27B877;
  --on-work:#04150D;
  --work-ink:#3CCB8A;
  --personal:#FF9A57;
  --on-personal:#2B1300;
  --personal-ink:#FF9A57;
  --done:#CFE8DA;
  --warn:#E3C567;
  --scrim:rgb(0 0 0 / .62);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.4 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[data-space="work"]{--accent:var(--work);--on-accent:var(--on-work);--accent-ink:var(--work-ink)}
[data-space="personal"]{--accent:var(--personal);--on-accent:var(--on-personal);--accent-ink:var(--personal-ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- frame ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
#app[data-view="week"]{max-width:1180px}
#app::before{content:"";flex:none;height:6px;background:linear-gradient(90deg,var(--flag-green) 0 33.34%,var(--flag-white) 33.34% 66.67%,var(--flag-orange) 66.67%)}
#top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 12px;padding:18px 20px 14px;border-bottom:2px solid var(--ink)}
#top h1{margin:0;font:800 clamp(26px,7.6vw,34px)/1 var(--display);font-stretch:75%;letter-spacing:-.01em}
#top p{margin:6px 0 0;font-size:13px;color:var(--quiet)}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--done);margin:0 6px 1px 8px}
.sync[data-s="wait"]::before{background:var(--quiet)}
.sync[data-s="off"]::before{background:var(--warn)}
.spaces{display:flex;flex:none;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.spaces button{min-height:40px;padding:8px 14px;font-weight:600;font-size:14px}
.spaces button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#main{flex:1;min-height:0;overflow-y:auto;padding:0 20px 28px}
#bar{display:grid;grid-template-columns:1fr 1fr 1fr auto;border-top:2px solid var(--ink);background:var(--paper)}
#bar button{min-height:58px;font-weight:600;font-size:15px;text-align:center}
#bar .tab[aria-current="page"]{box-shadow:inset 0 4px 0 var(--accent-ink)}
#bar .tab .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12px;line-height:20px;font-variant-numeric:tabular-nums}
#bar .cap{padding:0 20px;background:var(--accent);color:var(--on-accent);font-size:16px}

/* ---------- sections and rows ---------- */
section{margin-top:22px}
.shd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.shd h2{margin:0;font:700 22px/1.1 var(--display);font-stretch:85%}
.shd h3{margin:0;font:600 14px/1.2 var(--body);color:var(--quiet)}
.hint{font-size:13px;color:var(--quiet);text-align:right}
.quietp{margin:6px 0 4px;font-size:14px;color:var(--quiet);max-width:60ch}

.t{display:block;font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.step{display:block;margin-top:3px;font-size:14.5px;overflow-wrap:anywhere}
.step.none{color:var(--quiet)}
.m{display:block;margin-top:3px;font-size:13px;color:var(--quiet);font-variant-numeric:tabular-nums}
.m.nudge{color:var(--warn);font-weight:600}
.is-done .t{text-decoration:line-through;color:var(--quiet);font-weight:500}
.is-done .step{display:none}

.check{display:grid;place-items:center;flex:none;width:44px;height:44px}
.check::before,.check::after{content:"";grid-area:1/1}
.check::before{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink)}
.check[aria-pressed="true"]::before{border-color:var(--done);background:var(--done)}
.check[aria-pressed="true"]::after{width:7px;height:12px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:translateY(-1.5px) rotate(45deg)}

.slot{display:grid;grid-template-columns:44px 1fr 44px;gap:0 10px;align-items:start;width:100%;padding:14px 0;border-top:1px solid var(--rule)}
.slot .check{margin-right:-9px;justify-self:end}
.num{font:800 54px/.84 var(--display);font-stretch:75%;color:var(--accent-ink)}
.slot.is-done .num,.slot.empty .num{color:var(--rule)}
.slot.empty{border-top-style:dashed}
.slot.empty .t{color:var(--quiet);font-weight:500}
.stitle{display:block;width:100%}
.sbody .btn{margin-top:10px}
.allthree{margin:10px 0 0;padding-top:12px;border-top:1px solid var(--rule);font-weight:600;color:var(--done)}

.row{display:grid;grid-template-columns:44px 1fr auto;gap:0 6px;align-items:center;margin-left:-9px;padding:6px 0;border-top:1px solid var(--rule)}
.row.col{align-items:start}
.row.nock{grid-template-columns:1fr auto;margin-left:0}
.rbody{display:block;width:100%;padding:6px 0}
.row .t{font-size:16px;font-weight:500}
.racts{display:flex;gap:6px}
.topmark{display:inline-block;width:8px;height:8px;margin:0 7px 2px 0;background:var(--accent-ink);vertical-align:middle}
.stuck{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 0 2px;border-top:1px solid var(--rule);font-size:14.5px;color:var(--quiet)}
.stuck .btn{color:var(--ink)}
.sortbtn{margin:8px 0 6px}
.linkbtn{min-height:32px;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sortitem{margin:4px 0 2px;font:700 24px/1.15 var(--display);font-stretch:85%;overflow-wrap:anywhere;text-wrap:balance}
.sortgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sortgrid .btn{min-height:52px;font-size:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 18px;border:1.5px solid var(--ink);border-radius:8px;font-weight:600;font-size:15px;text-align:center}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.tight{margin:2px 0 8px}
.chip{min-height:36px;padding:6px 13px;border:1px solid var(--quiet);border-radius:999px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.fstrip{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--accent);color:var(--on-accent)}
.fstrip b{font:800 24px/1 var(--display);font-stretch:75%;font-variant-numeric:tabular-nums}
.fstrip .ft{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fstrip .fo{font-size:14px;font-weight:600;text-decoration:underline}

.notice{margin:16px 0 0;padding:10px 14px;border-left:4px solid var(--warn);background:var(--sheet);font-size:14px}
.start{margin-top:18px;padding:16px 18px 18px;border:1.5px solid var(--ink);border-radius:12px;background:var(--sheet)}
.start h2{margin:0;font:700 22px/1.1 var(--display);font-stretch:85%}
.start ol{margin:10px 0 16px;padding-left:20px;display:grid;gap:6px;max-width:56ch}
.loading{margin-top:40px;color:var(--quiet)}

/* ---------- week ---------- */
.wnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.wnav h2{margin:0;font:800 30px/1 var(--display);font-stretch:75%}
.wnav p{margin:5px 0 0;font-size:14px;color:var(--quiet)}
.arrows{display:flex;align-items:center;gap:8px}
.arrow{display:grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--ink);border-radius:8px;font-size:22px;line-height:1;font-weight:600;text-align:center}
.ritual{margin:16px 0 0;padding:0;list-style:none;counter-reset:r;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);max-width:520px}
.ritual li{counter-increment:r;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:6px 14px;border-top:1px solid var(--rule);font-size:15px}
.ritual li:first-child{border-top:0}
.ritual li > :first-child::before{content:counter(r) ". ";color:var(--quiet);font-variant-numeric:tabular-nums}
.ritual button{text-decoration:underline;text-underline-offset:3px;min-height:32px}
.ritual .ok{color:var(--done);font-weight:600}
.ritual .todo{color:var(--quiet);font-variant-numeric:tabular-nums;white-space:nowrap}
.outcomes{max-width:640px}
.outcome{display:grid;grid-template-columns:44px 1fr;align-items:center;margin-left:-9px;border-top:1px solid var(--rule)}
.outcome input{width:100%;min-height:50px;padding:0;border:0;border-radius:0;background:transparent;font-weight:500}
.outcome input::placeholder{color:var(--quiet);font-weight:400}
.outcome.is-done input{text-decoration:line-through;color:var(--quiet)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 26px}
.day{min-width:0;padding:10px 0 14px;border-top:2px solid var(--ink)}
.day.past{border-top-color:var(--rule)}
.dhead{display:flex;align-items:center;gap:8px;min-height:36px}
.dname{font:800 22px/1 var(--display);font-stretch:75%}
.day.past .dname{color:var(--quiet)}
.day.today .dname{color:var(--accent-ink)}
.dtag{font-size:12px;font-weight:700;color:var(--accent-ink)}
.heavy{padding:1px 8px;border:1px solid var(--warn);border-radius:999px;font-size:12px;font-weight:700;color:var(--warn)}
.dload{margin-left:auto;font-size:13px;color:var(--quiet);font-variant-numeric:tabular-nums}
.dadd{min-height:36px;padding-left:6px;font-size:14px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.day .row{padding:0;border-top:0}
.day .row .t{font-size:15px}
.empty-day{margin:4px 0 0;font-size:14px;color:var(--quiet)}
.wins{margin:6px 0 0;padding:0;list-style:none}
.wins li{display:grid;grid-template-columns:44px 1fr;padding:6px 0;border-top:1px solid var(--rule);font-size:15px;overflow-wrap:anywhere}
.wins span{color:var(--quiet);font-size:13px;line-height:1.7}

/* ---------- now ---------- */
#now{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;overflow-y:auto;background:var(--accent);color:var(--on-accent);animation:flood .28s ease-out}
@keyframes flood{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
.now-in{flex:1;display:flex;flex-direction:column;gap:16px;width:100%;max-width:640px;margin:0 auto;padding:16px 22px 26px}
.now-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.now-top button{min-height:44px;padding:0 0 0 16px;text-decoration:underline;text-underline-offset:3px}
.now-title{margin:8px 0 0;font:700 clamp(26px,7.2vw,42px)/1.08 var(--display);font-stretch:85%;text-wrap:balance;overflow-wrap:anywhere}
.now-step{margin:0;font-size:17px;overflow-wrap:anywhere}
.digits{display:flex;margin:10px 0 0;font:800 clamp(96px,31vw,190px)/.86 var(--display);font-stretch:75%}
.digits span{display:inline-block;width:.56em;text-align:center}
.digits span.c{width:.26em}
.now-msg{margin:0;min-height:1.4em;font-weight:600}
#parkform{display:flex;gap:8px}
#parkform input{flex:1;min-width:0;min-height:46px;padding:0 12px;border:1.5px solid var(--on-accent);border-radius:8px;background:transparent;color:var(--on-accent)}
#parkform input::placeholder{color:var(--on-accent);opacity:.8}
#now :focus-visible{outline-color:var(--on-accent)}
#now .btn{border-color:var(--on-accent);color:var(--on-accent)}
#now .btn.solid{background:var(--on-accent);color:var(--accent)}
.now-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:14px}
.now-acts .solid{flex:1 1 100%;min-height:54px;font-size:17px}
.now-acts .btn:not(.solid){flex:1}

/* ---------- sheets ---------- */
#scrim{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;background:var(--scrim)}
.sheet{display:flex;flex-direction:column;gap:14px;width:100%;max-width:720px;max-height:100%;overflow-y:auto;padding:14px 20px 22px;border-radius:0 0 18px 18px;background:var(--sheet);box-shadow:0 12px 40px rgb(0 0 0 / .25);animation:drop .18s ease-out}
@keyframes drop{from{transform:translateY(-14px)}to{transform:none}}
@media (min-width:760px){
  #scrim{align-items:center;padding:24px}
  .sheet{max-width:560px;border-radius:14px}
}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.shead h2{margin:0;font:700 24px/1.1 var(--display);font-stretch:85%}
.x{min-height:44px;padding-left:16px;font-size:14px;font-weight:600;color:var(--quiet);text-decoration:underline;text-underline-offset:3px}
.sheet h3{margin:6px 0 0;font:600 14px/1.2 var(--body);color:var(--quiet)}
.sheet label,.sheet legend{display:block;margin:0 0 6px;padding:0;font-size:13px;font-weight:600;color:var(--quiet)}
.sheet fieldset{min-width:0;margin:0;padding:0;border:0}
.sheet input[type="text"],.sheet input[type="date"]{width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper)}
.sheet input[type="date"]{width:auto;min-height:36px;border-width:1px;border-color:var(--quiet);border-radius:999px;font-size:14px}
#capform{display:flex;gap:8px}
#capform input{flex:1;min-width:0}
.note{margin:0;font-size:14px;color:var(--quiet)}
.err{margin:0;font-size:14px;font-weight:600;color:var(--warn)}
.sfoot{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.sfoot .solid{flex:1}
.sheet .row:first-of-type{border-top:0}

#toast{position:fixed;left:50%;bottom:74px;z-index:50;transform:translateX(-50%);display:flex;align-items:center;gap:14px;width:max-content;max-width:min(92%,520px);padding:12px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:15px}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{flex:none;min-height:32px;font-weight:700;text-decoration:underline}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-space="work">
<div id="app" data-view="today">
  <header id="top"></header>
  <main id="main"></main>
  <nav id="bar" aria-label="Views"></nav>
</div>
<div id="now" hidden></div>
<div id="scrim" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const VIEWS = ['today','inbox','week'];
const HEAVY = {work:300, personal:180};   /* minutes planned before a day is flagged */
const pad = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const fromKey = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monday = d => addDays(d, -((d.getDay() + 6) % 7));
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return {year: t.getUTCFullYear(), week: Math.ceil(((t - y0) / 86400000 + 1) / 7)};
}
const weekKey = d => { const w = isoWeek(d); return w.year + '-W' + pad(w.week); };
const shortDay = d => DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
function mins(m){
  if(!m) return '';
  if(m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + 'h' + (r ? ' ' + r + 'm' : '');
}
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

/* ---------- state ---------- */
const S = {
  view:'today', space:'work', weekOffset:0, today:dkey(new Date()),
  tasks:new Map(), weeks:new Map(), focus:null,
  loaded:false, mode:'loading', confirmed:false, stale:false,
  sheet:null, nowOpen:false, undo:null, laterOpen:false
};
try{ const sp = localStorage.getItem('three-things-space'); if(sp === 'work' || sp === 'personal') S.space = sp; }catch(e){}

/* ---------- storage ---------- */
let B = null;
let baseTasks = new Map(), baseWeeks = new Map(), baseFocus = new Map();
const chains = {};
function enqueue(key, fn){
  const run = (chains[key] || Promise.resolve()).then(fn);
  chains[key] = run.catch(() => {});
  return run;
}
/* Local changes sit on top of the last server copy until their write lands. */
function overlay(){
  const p = new Map();
  return {
    track(id, val, promise){
      const n = ((p.get(id) || {}).n || 0) + 1;
      p.set(id, {n, val});
      const fin = () => { const c = p.get(id); if(c && c.n === n) p.delete(id); };
      promise.then(() => { fin(); refresh(); }, e => { fin(); refresh(); writeFailed(e); });
    },
    apply(base){
      const m = new Map(base);
      p.forEach((v, id) => { if(v.val === null) m.delete(id); else m.set(id, v.val); });
      return m;
    },
    busy(){ return p.size > 0; }
  };
}
const oT = overlay(), oW = overlay(), oF = overlay();
function recompute(){
  S.tasks = oT.apply(baseTasks);
  S.weeks = oW.apply(baseWeeks);
  S.focus = oF.apply(baseFocus).get('f') || null;
}
function refresh(){ recompute(); render(); }
function writeFailed(e){
  const code = e && e.code;
  toast(code === 'quota_exceeded' ? 'Storage is full. Drop some finished tasks, then try again.' : 'That did not save. Check your connection and try again.');
}

function memoryBackend(persist){
  const KEY = 'three-things-v1';
  let n = 0;
  function save(){
    if(!persist) return;
    try{
      const weeks = {};
      baseWeeks.forEach((v, k) => { weeks[k] = v; });
      localStorage.setItem(KEY, JSON.stringify({tasks:[...baseTasks.values()], weeks, focus:baseFocus.get('f') || null}));
    }catch(e){}
  }
  return {
    newId: () => 't' + Date.now().toString(36) + (n++).toString(36) + Math.random().toString(36).slice(2, 6),
    putTask(id, data){ baseTasks.set(id, Object.assign({id}, data)); save(); return Promise.resolve(); },
    patchTask(id, ch){ const c = baseTasks.get(id); if(c) baseTasks.set(id, Object.assign({}, c, ch)); save(); return Promise.resolve(); },
    delTask(id){ baseTasks.delete(id); save(); return Promise.resolve(); },
    putWeek(k, data){ baseWeeks.set(k, data); save(); return Promise.resolve(); },
    putFocus(data){ if(data) baseFocus.set('f', data); else baseFocus.delete('f'); save(); return Promise.resolve(); },
    start(){
      if(persist){
        try{
          const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
          if(raw){
            (raw.tasks || []).forEach(t => baseTasks.set(t.id, t));
            Object.keys(raw.weeks || {}).forEach(k => baseWeeks.set(k, raw.weeks[k]));
            if(raw.focus) baseFocus.set('f', raw.focus);
          }
        }catch(e){}
      }
      S.loaded = true; refresh();
    }
  };
}

function dbBackend(db, uid){
  const root = db.doc('data/users/' + uid + '/planner');
  const tasks = root.collection('tasks'), weeks = root.collection('weeks'), focus = root.collection('meta').doc('focus');
  return {
    newId: () => tasks.doc().id,
    putTask: (id, data) => enqueue('t' + id, () => tasks.doc(id).set(data)),
    patchTask: (id, ch) => enqueue('t' + id, () => tasks.doc(id).update(ch)),
    delTask: id => enqueue('t' + id, () => tasks.doc(id).delete()),
    putWeek: (k, data) => enqueue('w' + k, () => weeks.doc(k).set(data)),
    putFocus: data => enqueue('focus', () => data ? focus.set(data) : focus.delete()),
    start(){
      const timer = setTimeout(() => { if(!S.confirmed){ S.stale = true; S.loaded = true; render(); } }, 10000);
      const settle = meta => { if(meta && !meta.fromCache){ S.confirmed = true; S.stale = false; clearTimeout(timer); } };
      const fail = () => { clearTimeout(timer); S.mode = 'detached'; S.loaded = true; render(); };
      tasks.onSnapshot(snap => {
        const m = new Map();
        snap.docs.forEach(d => { const v = d.data(); if(v) m.set(d.id, Object.assign({id:d.id}, v)); });
        baseTasks = m; S.loaded = true; settle(snap.metadata); refresh();
      }, fail);
      weeks.onSnapshot(snap => {
        const m = new Map();
        snap.docs.forEach(d => { const v = d.data(); if(v) m.set(d.id, v); });
        baseWeeks = m; refresh();
      }, fail);
      focus.onSnapshot(snap => {
        const m = new Map();
        const v = snap.exists ? snap.data() : null;
        if(v) m.set('f', v);
        baseFocus = m; refresh();
      }, fail);
    }
  };
}

async function boot(){
  render();
  const c = window.claude;
  if(!c || typeof c.use !== 'function'){ S.mode = 'local'; B = memoryBackend(true); B.start(); return; }
  let db = null, uid = null;
  try{
    const got = await Promise.all([c.use('db'), c.use('user')]);
    db = got[0];
    if(got[1]) uid = await got[1].id();
  }catch(e){}
  if(!db || !uid){ S.mode = 'detached'; B = memoryBackend(false); B.start(); return; }
  S.mode = 'synced'; B = dbBackend(db, uid); B.start();
}

/* ---------- task changes ---------- */
const strip = t => { const o = Object.assign({}, t); delete o.id; return o; };
function create(data){
  const id = B.newId();
  const t = Object.assign({id, title:'', step:'', est:0, space:S.space, day:null, top:false, order:0, done:false, doneAt:0, createdAt:Date.now(), rolls:0, spent:0, parked:0, later:false, wait:'', repeat:'', nextId:''}, data);
  oT.track(id, t, B.putTask(id, strip(t)));
  refresh();
  return id;
}
function patch(id, ch){
  const cur = S.tasks.get(id);
  if(!cur) return;
  oT.track(id, Object.assign({}, cur, ch), B.patchTask(id, ch));
  refresh();
}
function remove(id){
  const cur = S.tasks.get(id);
  if(!cur) return null;
  oT.track(id, null, B.delTask(id));
  refresh();
  return cur;
}
function restore(t){ oT.track(t.id, t, B.putTask(t.id, strip(t))); refresh(); }
const topCount = (day, space, except) => [...S.tasks.values()].filter(t => t.space === space && t.day === day && t.top && t.id !== except).length;
const tomorrowKey = () => dkey(addDays(fromKey(S.today), 1));

/* Repeats: finishing or skipping one creates the next, so missed days never pile up. */
function nextDay(t){
  if(t.repeat === 'weekly'){
    let d = fromKey(t.day || S.today);
    do { d = addDays(d, 7); } while(dkey(d) <= S.today);
    return dkey(d);
  }
  let d = addDays(fromKey(S.today), 1);
  if(t.repeat === 'weekdays') while(d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1);
  return dkey(d);
}
function spawnNext(t){
  return create({title:t.title, step:t.step || '', est:t.est || 0, space:t.space, repeat:t.repeat, day:nextDay(t)});
}
function finish(t){
  const ch = {done:true, doneAt:Date.now()};
  if(t.day !== S.today){ ch.day = S.today; ch.top = false; }
  let spawned = '';
  if(t.repeat){ spawned = spawnNext(t); ch.nextId = spawned; }
  return {ch, spawned};
}
function toggleDone(id){
  const t = S.tasks.get(id);
  if(!t) return;
  if(t.done){
    const nx = t.nextId && S.tasks.get(t.nextId);
    if(nx && !nx.done) remove(t.nextId);
    patch(id, {done:false, doneAt:0, nextId:''});
    return;
  }
  if(S.focus && S.focus.taskId === id){ stopFocus(true); return; }
  const prev = {done:false, doneAt:0, day:t.day, top:t.top, nextId:''};
  const f = finish(t);
  patch(id, f.ch);
  toast('Done: ' + clip(t.title, 40), () => { if(f.spawned) remove(f.spawned); patch(id, prev); });
}
function moveTo(id, to){
  const t = S.tasks.get(id);
  if(!t) return;
  const ch = {top:false, later:false};
  if(to === 'inbox') ch.day = null;
  else {
    ch.day = to === 'today' ? S.today : tomorrowKey();
    if(t.day && t.day !== ch.day) ch.rolls = (t.rolls || 0) + 1;
  }
  patch(id, ch);
}
function dropTask(id, skip){
  if(S.focus && S.focus.taskId === id) setFocus(null);
  const t0 = S.tasks.get(id);
  let spawned = '', when = '';
  if(skip && t0 && t0.repeat && !t0.done){ when = shortDay(fromKey(nextDay(t0))); spawned = spawnNext(t0); }
  const t = remove(id);
  if(t) toast(spawned ? 'Skipped. Next one is ' + when + '.' : 'Dropped: ' + clip(t.title, 36), () => { if(spawned) remove(spawned); restore(t); });
}

/* ---------- focus ---------- */
function setFocus(f){ oF.track('f', f, B.putFocus(f)); refresh(); }
function logFocus(markDone){
  const f = S.focus;
  if(!f) return;
  const t = S.tasks.get(f.taskId);
  const el = Math.max(0, Math.round((Date.now() - f.startedAt) / 60000));
  if(t){
    const ch = markDone ? finish(t).ch : {};
    if(el) ch.spent = (t.spent || 0) + el;
    if(Object.keys(ch).length) patch(f.taskId, ch);
  }
  setFocus(null);
}
function startFocus(id){
  const t = S.tasks.get(id);
  if(!t || t.done) return;
  if(!(S.focus && S.focus.taskId === id)){
    if(S.focus) logFocus(false);
    setFocus({taskId:id, startedAt:Date.now(), planned:t.est || 25});
  }
  S.nowOpen = true; render();
}
function stopFocus(markDone){
  const f = S.focus, t = f && S.tasks.get(f.taskId);
  logFocus(markDone);
  S.nowOpen = false; render();
  if(t) toast(markDone ? 'Done: ' + clip(t.title, 40) : 'Stopped. Time logged.');
}

/* ---------- lists ---------- */
function lists(){
  const today = S.today;
  const all = [...S.tasks.values()].filter(t => t.space === S.space);
  const todays = all.filter(t => t.day === today);
  const tops = todays.filter(t => t.top).sort((a, b) => (a.order || 0) - (b.order || 0) || a.createdAt - b.createdAt).slice(0, 3);
  return {
    all, tops,
    inbox: all.filter(t => !t.done && !t.day && !t.later && !t.wait).sort((a, b) => b.createdAt - a.createdAt),
    later: all.filter(t => !t.done && !t.day && t.later && !t.wait).sort((a, b) => b.createdAt - a.createdAt),
    waiting: all.filter(t => !t.done && t.wait).sort((a, b) => { const x = a.day || '9', y = b.day || '9'; return x < y ? -1 : x > y ? 1 : a.createdAt - b.createdAt; }),
    carried: all.filter(t => !t.done && t.day && t.day < today).sort((a, b) => a.day < b.day ? -1 : a.day > b.day ? 1 : a.createdAt - b.createdAt),
    also: todays.filter(t => !t.done && tops.indexOf(t) < 0).sort((a, b) => a.createdAt - b.createdAt),
    openToday: todays.filter(t => !t.done),
    doneToday: all.filter(t => t.done && dkey(new Date(t.doneAt)) === today).sort((a, b) => a.doneAt - b.doneAt)
  };
}
const viewWeekStart = () => addDays(monday(fromKey(S.today)), 7 * S.weekOffset);
const wkKey = () => weekKey(viewWeekStart()) + '_' + S.space;
function getWeek(){
  const w = S.weeks.get(wkKey());
  return {o:[0, 1, 2].map(i => { const x = w && w.o && w.o[i]; return {t:(x && x.t) || '', d:!!(x && x.d)}; })};
}
const pendWeek = {};
function setWeek(k, w){ oW.track(k, w, B.putWeek(k, w)); refresh(); }

/* ---------- pieces ---------- */
const isFocus = t => !!(S.focus && S.focus.taskId === t.id);
function check(t){
  return '<button type="button" class="check" data-act="toggle" data-id="' + t.id + '" aria-pressed="' + !!t.done + '" aria-label="' + (t.done ? 'Mark not done: ' : 'Mark done: ') + esc(t.title) + '"></button>';
}
function metaLine(t){
  const b = [];
  if(t.est) b.push(mins(t.est));
  if(t.spent) b.push(mins(t.spent) + ' spent');
  if(t.parked && !t.day && !t.done) b.push('parked during focus');
  if(t.wait && !t.done) b.push('waiting on ' + esc(t.wait));
  if(t.repeat) b.push(t.repeat === 'weekly' ? 'weekly' : t.repeat === 'weekdays' ? 'weekdays' : 'daily');
  if((t.rolls || 0) >= 3 && !t.done) b.push('moved ' + t.rolls + ' times');
  return b.join(' · ');
}
function row(t, o){
  const ml = metaLine(t);
  const m = (o.when ? (t.day ? 'follow up ' + shortDay(fromKey(t.day)) : 'no follow-up day') + (ml ? ' · ' : '') : '') + ml;
  let acts = '';
  if(o.unblock) acts = '<button type="button" class="btn sm" data-act="unblock" data-id="' + t.id + '">Got reply</button>';
  if(o.toinbox) acts = '<button type="button" class="btn sm" data-act="toinbox" data-id="' + t.id + '">To inbox</button>';
  if(o.start && !t.done) acts = '<button type="button" class="btn sm" data-act="start" data-id="' + t.id + '">' + (isFocus(t) ? 'Timer' : 'Start') + '</button>';
  if(o.today && !t.done) acts = '<button type="button" class="btn sm" data-act="move" data-to="today" data-id="' + t.id + '">Today</button>';
  if(o.pick) acts = '<button type="button" class="btn sm" data-act="pick" data-id="' + t.id + '">Pick</button>';
  if(o.sort && !t.done) acts = '<button type="button" class="chip" data-act="move" data-to="tomorrow" data-id="' + t.id + '">Tomorrow</button><button type="button" class="chip" data-act="move" data-to="inbox" data-id="' + t.id + '">Inbox</button><button type="button" class="chip" data-act="drop" data-id="' + t.id + '">' + (t.repeat ? 'Skip' : 'Drop') + '</button>';
  const body = '<button type="button" class="rbody" data-act="edit" data-id="' + t.id + '"><span class="t">' + (o.mark && t.top ? '<i class="topmark"></i>' : '') + esc(t.title) + '</span>' + (m ? '<span class="m">' + m + '</span>' : '') + '</button>';
  if(o.sort) return '<div class="row col' + (t.done ? ' is-done' : '') + '">' + (o.nocheck ? '<span></span>' : check(t)) + '<div>' + body + '<div class="chips tight">' + acts + '</div></div></div>';
  return '<div class="row' + (o.nocheck ? ' nock' : '') + (t.done ? ' is-done' : '') + '">' + (o.nocheck ? '' : check(t)) + body + '<span class="racts">' + acts + '</span></div>';
}
function carriedRow(t){
  const nudge = (t.rolls || 0) >= 3 ? '<span class="m nudge">Moved ' + t.rolls + ' times. Shrink the first step, or drop it.</span>' : '';
  return '<div class="row col">' + check(t) + '<div><button type="button" class="rbody" data-act="edit" data-id="' + t.id + '"><span class="t">' + esc(t.title) + '</span><span class="m">from ' + shortDay(fromKey(t.day)) + (t.est ? ' · ' + mins(t.est) : '') + '</span>' + nudge + '</button>' +
    '<div class="chips tight"><button type="button" class="chip" data-act="move" data-to="today" data-id="' + t.id + '">Today</button><button type="button" class="chip" data-act="move" data-to="tomorrow" data-id="' + t.id + '">Tomorrow</button><button type="button" class="chip" data-act="move" data-to="inbox" data-id="' + t.id + '">Inbox</button><button type="button" class="chip" data-act="drop" data-id="' + t.id + '">' + (t.repeat ? 'Skip' : 'Drop') + '</button></div></div></div>';
}
function slot(i, t, primary){
  if(!t) return '<button type="button" class="slot empty" data-act="fill"><span class="num" aria-hidden="true">' + i + '</span><span class="sbody"><span class="t">Open slot</span><span class="m">Pick or add priority ' + i + '</span></span><span></span></button>';

    (t.done ? '' : '<button type="button" class="btn' + (primary ? ' solid' : ' sm') + '" data-act="start" data-id="' + t.id + '">' + (isFocus(t) ? 'Open timer' : 'Start') + '</button>') +
    '</div>' + check(t) + '</div>';

function noticeHTML(){

  let est = '';
  if(cmp.length >= 3){
    const r = cmp.reduce((s, t) => s + t.spent, 0) / cmp.reduce((s, t) => s + t.est, 0);
    est = r >= 1.15 ? 'Tasks ran about ' + r.toFixed(1) + '× your estimates. Pad next week\'s guesses.' : r <= 0.85 ? 'You finished faster than you guessed, about ' + r.toFixed(1) + '× the estimate.' : 'Your time estimates were close this week.';
  }
  h += '<section><div class="shd"><h3>Done this week · ' + wins.length + '</h3><span class="hint">' + (focused ? mins(focused) + ' focused' : '') + '</span></div>' +
    (wins.length ? '<ul class="wins">' + wins.map(t => '<li><span>' + DOW[new Date(t.doneAt).getDay()] + '</span>' + esc(t.title) + '</li>').join('') + '</ul>' : '<p class="quietp">Finished tasks collect here.</p>') +
    (est ? '<p class="quietp">' + est + '</p>' : '') + '</section>';
  return h;
}

  const t = fromKey(S.today), out = [{k:'', l:'Inbox'}, {k:'later', l:'Later'}, {k:S.today, l:'Today'}, {k:tomorrowKey(), l:'Tomorrow'}];
  const end = addDays(monday(t), 6);

function saveEdit(){

  if(d.top && topCount(d.day, d.space, s.id) >= 3){ s.err = 'That day already has three priorities. Swap one out first.'; renderSheet(); return; }

  const DEF = {step:'', est:0, top:false, later:false, wait:'', repeat:''};
  const ch = {};
  Object.keys(next).forEach(k => { const cur = t[k] === undefined ? DEF[k] : t[k]; if(next[k] !== cur) ch[k] = next[k]; });

/* ---------- toast, timer, routing ---------- */
let toastT = 0;
function toast(msg, undo){
  const el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" data-act="undo">Undo</button>' : '');
  el.hidden = false;
  S.undo = undo || null;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.hidden = true; S.undo = null; }, 6000);
}
function tick(){
  const k = dkey(new Date());
  if(k !== S.today){ S.today = k; render(); return; }
  const f = S.focus;
  if(!f) return;
  const left = Math.round(f.planned * 60 - (Date.now() - f.startedAt) / 1000);
  const over = left < 0, s = Math.abs(left);
  const txt = (over ? '+' : '') + pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  document.querySelectorAll('[data-timer]').forEach(e => { if(e.textContent !== txt) e.textContent = txt; });
  const big = $('[data-big]');
  if(big && big.dataset.v !== txt){
    big.dataset.v = txt;
    big.innerHTML = txt.split('').map(c => '<span' + (c === ':' || c === '+' ? ' class="c"' : '') + '>' + c + '</span>').join('');
    const msg = $('#nowmsg');
    if(msg){
      const m = over ? 'Time is up. Finished, or need longer?' : 'One thing. ' + f.planned + ' minutes.';
      if(msg.textContent !== m) msg.textContent = m;
    }
  }
}
function go(view){
  if(VIEWS.indexOf(view) < 0) return;
  S.view = view;
  if(location.hash.slice(1) !== view){ try{ location.hash = view; }catch(e){} }
  render();
  $('#main').scrollTop = 0;
}
function render(){
  document.body.dataset.space = S.space;
  $('#app').dataset.view = S.view;
  renderTop(); renderMain(); renderBar(); renderNow(); renderSheetLive();
}

/* ---------- actions ---------- */
const ACT = {
  space(b){ S.space = b.dataset.space; try{ localStorage.setItem('three-things-space', S.space); }catch(e){} render(); },
  go(b){ go(b.dataset.view); },
  capture(){ openCapture({}); },
  addday(b){ openCapture({day:b.dataset.day}); },
  fill(){ openCapture({day:S.today, top:true}); },
  capdest(b){ S.sheet.day = b.dataset.day || null; S.sheet.err = ''; renderSheet(); },
  pick(b, id){
    const s = S.sheet, day = (s && s.day) || S.today;
    if(topCount(day, S.space, id) >= 3){ if(s){ s.err = 'That day already has three. Swap one out first.'; renderSheet(); } return; }
    closeSheet();
    patch(id, {day, top:true, order:Date.now()});
  },
  close(){ closeSheet(); },
  closeday(){ closeSheet(); toast('Day closed. Rest well.'); },
  toggle(b, id){ toggleDone(id); },
  edit(b, id){ openEdit(id); },
  start(b, id){ startFocus(id); },
  opennow(){ S.nowOpen = true; render(); },
  hidenow(){ S.nowOpen = false; render(); },
  fdone(){ stopFocus(true); },
  fstop(){ stopFocus(false); },
  fmore(b){ const f = S.focus; if(f) setFocus(Object.assign({}, f, {planned:f.planned + Number(b.dataset.n)})); },
  move(b, id){ moveTo(id, b.dataset.to); },
  drop(b, id){ dropTask(id, true); },
  sortopen(){ S.sheet = {type:'sort', skipped:[], count:0}; renderSheet(true); },
  sortto(b, id){ const s = S.sheet; if(s && s.type === 'sort') s.count++; patch(id, {day:b.dataset.day, later:false, top:false}); },
  sortlater(b, id){ const s = S.sheet; if(s && s.type === 'sort') s.count++; patch(id, {later:true, day:null, top:false}); },
  sortskip(b, id){ S.sheet.skipped.push(id); renderSheet(); },
  unblock(b, id){ patch(id, {wait:''}); toast('Unblocked. It is yours again.'); },
  toinbox(b, id){ patch(id, {later:false}); },
  latertoggle(){ S.laterOpen = !S.laterOpen; render(); },
  picknext(){ const L = lists(), t = L.tops.find(x => !x.done) || L.also[0]; if(t) startFocus(t.id); },
  picksmall(){ const c = lists().openToday.slice().sort((a, b) => (a.est || 999) - (b.est || 999) || a.createdAt - b.createdAt); if(c[0]) startFocus(c[0].id); },
  edrep(b){ const d = S.sheet.draft; d.repeat = b.dataset.r || ''; if(d.repeat && !d.day){ d.day = S.today; d.later = false; } renderSheet(); },
  undo(){ const u = S.undo; S.undo = null; $('#toast').hidden = true; if(u) u(); },
  wk(b){ S.weekOffset += Number(b.dataset.d); render(); },
  wknow(){ S.weekOffset = 0; render(); },
  shutdown(){ S.sheet = {type:'shutdown'}; renderSheet(true); },
  otoggle(b){
    const k = wkKey(), w = pendWeek[k] || getWeek(), i = Number(b.dataset.i);
    if(!w.o[i].t) return;
    w.o[i].d = !w.o[i].d;
    if(!pendWeek[k]) setWeek(k, w);
  },
  edest(b){ const d = S.sheet.draft, n = Number(b.dataset.n); d.est = d.est === n ? 0 : n; renderSheet(); },
  edday(b){
    const d = S.sheet.draft, k = b.dataset.day;
    if(k === 'later'){ d.day = null; d.later = true; } else { d.day = k || null; d.later = false; }
    if(!d.day){ d.top = false; d.repeat = ''; }
    S.sheet.err = ''; renderSheet();
  },
  edtop(){ const d = S.sheet.draft; d.top = !d.top; if(d.top && !d.day) d.day = S.today; S.sheet.err = ''; renderSheet(); },
  edspace(b){ S.sheet.draft.space = b.dataset.space; S.sheet.err = ''; renderSheet(); },
  edsave(){ saveEdit(); },
  eddel(){
    const s = S.sheet;
    if(!s.confirmDel){ s.confirmDel = true; renderSheet(); return; }
    closeSheet(); dropTask(s.id);
  }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b){ if(e.target.id === 'scrim') closeSheet(); return; }
  if(b.disabled || !B) return;
  const fn = ACT[b.dataset.act];
  if(fn) fn(b, b.dataset.id);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if(!B) return;
  if(e.target.id === 'capform') capAdd();
  else if(e.target.id === 'parkform'){
    const inp = $('#parkin'), text = inp.value.trim(), f = S.focus;
    if(!text || !f) return;
    const t = S.tasks.get(f.taskId);
    inp.value = '';
    create({title:text, parked:f.startedAt, space:t ? t.space : S.space});
  }
});
document.addEventListener('input', e => {
  const s = S.sheet;
  if(!s || s.type !== 'edit') return;
  if(e.target.id === 'ed-title') s.draft.title = e.target.value;
  else if(e.target.id === 'ed-step') s.draft.step = e.target.value;
  else if(e.target.id === 'ed-wait') s.draft.wait = e.target.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'ed-date' && S.sheet && S.sheet.type === 'edit'){
    S.sheet.draft.day = el.value || null;
    if(S.sheet.draft.day) S.sheet.draft.later = false; else S.sheet.draft.top = false;
    renderSheet();
  }else if(el.dataset && el.dataset.outcome != null && B){
    const k = wkKey(), w = pendWeek[k] || getWeek(), i = Number(el.dataset.outcome);
    w.o[i].t = el.value.trim();
    if(!w.o[i].t) w.o[i].d = false;
    /* wait a beat so a tap that caused the blur still lands on its target;
       edits made inside that beat join the same save */
    if(!pendWeek[k]){
      pendWeek[k] = w;
      setTimeout(() => { const x = pendWeek[k]; delete pendWeek[k]; setWeek(k, x); }, 250);
    }
  }
});
$('#main').addEventListener('focusout', () => { setTimeout(() => { if(mainDirty) renderMain(); }, 250); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(S.sheet) closeSheet();
    else if(S.nowOpen){ S.nowOpen = false; render(); }
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if(e.key === 'c' && !e.metaKey && !e.ctrlKey && !e.altKey && tag !== 'input' && tag !== 'textarea' && !S.sheet && !S.nowOpen){
    e.preventDefault(); openCapture({});
  }
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if(VIEWS.indexOf(h) >= 0 && h !== S.view){ S.view = h; render(); $('#main').scrollTop = 0; }
});
setInterval(tick, 500);

/* ---------- start ---------- */
function start(data){
  const h = location.hash.slice(1);
  if(VIEWS.indexOf(h) >= 0) S.view = h;
  else if(data && VIEWS.indexOf(data.view) >= 0) S.view = data.view;
  if(data && typeof data.weekOffset === 'number') S.weekOffset = data.weekOffset;
  boot();
}
const hot = window.claude && window.claude.hot;
if(hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({view:S.view, weekOffset:S.weekOffset}));
if(hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
